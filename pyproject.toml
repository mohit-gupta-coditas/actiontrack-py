[project]
name = "actiontrack"
dynamic = ["version"]
description = "Extract, track and follow up on action items from meeting notes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
    "dateparser>=1.2",
    "rapidfuzz>=3.9",
    "jinja2>=3.1",
    "mcp>=1.0",
]

[project.scripts]
actiontrack = "actiontrack.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "actiontrack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["actiontrack"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["actiontrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = ["slow: performance and end-to-end tests (excluded by default)"]
