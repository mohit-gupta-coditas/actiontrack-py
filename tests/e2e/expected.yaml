# Expected outcomes for `ingest notes/`, written by hand from reading the notes (T12.2, G28).
# Not generated by the tool. Paths are relative to the repo root. Dates assume the D8 rule:
# the latest meeting with a resolved due date wins.

skipped:                                    # file → reason (only *.md files are scanned)
  notes/2026-09-09-notes-final-v2.md: empty_file
  notes/2026-09-23-standup.md: missing_attendees
  notes/2026-10-03-sales-pipeline.md: unparseable_date     # "Date: sometime last week"
  notes/scratch.md: binary_file                            # NUL bytes, PNG fragment
  notes/untitled.md: missing_date                          # no header, date or attendees

# 30 notes ingest with 111 checkbox lines (the blockquote, code-fence and HTML-comment
# checkboxes don't count). 23 merges are certain → 88 unique. 3 spare for borderline fuzzy pairs.
min_unique_items: 85

